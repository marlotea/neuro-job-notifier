# Company watchlist.
#
#   name:         how the company appears in emails
#   ats:          greenhouse | lever | ashby | unknown
#   slug:         the company's ID on that job board (only for greenhouse/lever/ashby)
#   careers_url:  the human-readable careers page
#   big_company:  false = every early-career role here is relevant
#                 true  = a job must also match a keyword in config/keywords.yaml
#   aliases:      other names the company appears under (e.g. on Simplify).
#                 Names must match exactly (ignoring case, punctuation, "Inc.").
#
# Companies with ats: unknown aren't fetched directly. They still matter: if one
# of them shows up on Simplify, the big_company rule above applies to that job.
#
# Every greenhouse/lever/ashby slug below was confirmed on 2026-10-29 to return
# that company's real job board.

