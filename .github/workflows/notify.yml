name: Job notifier

on:
  schedule:
    # Cron times are in UTC. 15:00 UTC is 8am in Vancouver during daylight time
    # (7am in winter). 00:00 UTC is 5pm daylight time (4pm in winter).
    - cron: "0 15 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

# NOTE: GitHub disables scheduled workflows on repos with no activity for 60
# days. The seen.json commits below normally prevent that. If no new jobs show
# up for two months, re-enable the workflow from the Actions tab.

permissions:
  contents: write # needed to push the updated state/seen.json

# Never run two copies at once. They would race to update seen.json.
concurrency:
  group: job-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Find and email new jobs
        run: python -m notifier.main
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ALERT_IMAP_USER: ${{ secrets.ALERT_IMAP_USER }}
          ALERT_IMAP_PASSWORD: ${{ secrets.ALERT_IMAP_PASSWORD }}

      # always() makes this step run even if the step above failed (for example,
      # one source was down). Emails that did go out are still in seen.json, and
      # we must save them or they'd be sent again.
      - name: Commit seen.json
        if: always()
        run: |
          # "git status --porcelain" prints nothing if the file is unchanged.
          # (Unlike "git diff", it also notices a brand-new, untracked file.)
          if [ -z "$(git status --porcelain -- state/seen.json)" ]; then
            echo "seen.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git commit -m "Update seen jobs"
          # If you pushed something while this ran, rebase onto it first.
          git pull --rebase
          git push
