# Company watchlist. Also feeds the company page of the website (docs/).
#
#   name:         how the company appears in emails and on the site
#   category:     invasive-bci | noninvasive-bci | neuromod | neuro-ai | institute | big-tech
#                 (groups companies on the website)
#   description:  one sentence on what they do, shown on the website
#   website:      the company's home page
#   linkedin:     the company's LinkedIn page. Leave it out if you haven't
#                 confirmed it; the site then links to a LinkedIn search.
#   ats:          greenhouse | lever | ashby | unknown
#   slug:         the company's ID on that job board (only for greenhouse/lever/ashby)
#   careers_url:  the human-readable careers page
#   big_company:  false = every early-career role here is relevant
#                 true  = a job must also match a keyword in config/keywords.yaml
#   aliases:      other names the company appears under (e.g. on Simplify).
#                 Names must match exactly (ignoring case, punctuation, "Inc.").
#
# Companies with ats: unknown aren't fetched directly. They still matter: if one
# of them shows up on Simplify, the big_company rule above applies to that job.
#
# Slugs were checked to return that company's real job board: the original
# entries on 2026-10-29, the ones marked "added 2026-11-24" on that date.
# LinkedIn links come from each company's own website, or from LinkedIn search
# results when the site didn't link one.

