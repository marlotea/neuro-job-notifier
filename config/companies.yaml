# Convergent Research runs several nonprofit research groups ("FROs"). E11 Bio
# and Arbor Neuroscience (the new name for Forest Neurotech) post their jobs on
# Convergent's Lever board. The same board also has non-neuro groups (ocean
# carbon, formal methods...), so it's marked big_company to require a keyword.
- name: Convergent Research
  ats: lever
  slug: convergentresearch
  careers_url: https://www.convergentresearch.org/careers
  big_company: true
  aliases: [E11 Bio, Arbor Neuroscience, Forest Neurotech]

